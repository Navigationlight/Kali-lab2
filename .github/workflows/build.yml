name: build
on:
  workflow_dispatch:
  push:
    paths: ['image/**']
permissions:
  contents: read
  packages: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          tags: ghcr.io/navigationlight/kali-lab:latest
